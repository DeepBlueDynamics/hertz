services:
  hertzd:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: hertz:dev
    container_name: hertzd
    restart: unless-stopped
    # Docker Desktop/WSL2 has no udev; root is needed to open /dev/bus/usb nodes.
    # On a real Linux host, remove this and install docker/60-hertz-rtlsdr.rules instead.
    user: "0:0"
    devices:
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - 'c 189:* rmw'
    environment:
      - HERTZ_TOKEN=${HERTZ_TOKEN}
      - HERTZ_BANDPLANS=/usr/share/hertz/bandplans
    ports:
      - "9080:9080"
    volumes:
      - ./data:/data
      - ./hertz.toml:/etc/hertz/hertz.toml:ro
