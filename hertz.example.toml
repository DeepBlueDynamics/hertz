# /etc/hertz/hertz.toml
[daemon]
listen = "0.0.0.0:9080"
data_dir = "/data"                    # recordings/, transcriptions/, logs/, history/
auth_token = "env:HERTZ_TOKEN"        # required for non-localhost + all MCP writes

[[dongle]]
serial = "MARINE01"
role = "channelized"                  # one wideband capture, all channels demodulated at once
bandplan = "marine-vhf-us"            # 2.4 MS/s @ 156.7375 MHz — whole band, zero retuning
tap_channel = "16"                    # always-on audio tap
squelch_db = 12.0
record = true

# Monitor role: tune one channel directly, or scan a list and lock on activity.
# [[dongle]]
# serial = "00000001"
# role = "monitor"
# bandplan = "marine-vhf-us"
# frequency_hz = 156625000             # fixed frequency when not scanning
# scan = ["68", "69", "71", "72"]       # hop these, lock while squelch is open
# squelch_db = 6.0
# record = true

# Phase 5 - hopscan role (accepted by the config, not implemented yet)
# [[dongle]]
# serial = "PUBLIC01"
# role = "hopscan"                      # analog-scanner style retune-and-dwell
# groups = ["frs-gmrs", "murs", "noaa-wx", "ham-2m-simplex", "railroad-aar"]
# dwell_ms = 150                        # per-stop power check; lock while squelch open
# priority = ["noaa-wx:WX2"]            # interleaved priority checks during lock
# squelch_db = 9.0
# record = true

# Transcription: Cactus Whistle, on-device (model downloads to the Whistle cache).
# [transcription]
# engine = "whistle"
# language = "auto"                     # or en, de, fr, es, it, nl, pl
# keywords = ["channel sixteen"]        # bias toward call signs and vessel names

# Relay: route transcripts to the Hyperia pane they name (see docs/OPERATIONS.md).
# [relay]
# token_file = "~/.hertz/hyperia-token"
# min_probability = 0.5
