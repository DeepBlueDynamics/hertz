[package]
name = "gnosis-radio"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
crossbeam-channel = "0.5"
num-complex = "0.4"
rtlsdr = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
hound = "3"
chrono = "0.4"
rustfft = "6.2"
ratatui = "0.28"
crossterm = "0.28"
ctrlc = "3.4"
tungstenite = "0.24"
ureq = "2"
base64 = "0.22"

[package.metadata.dist]
dist = false
