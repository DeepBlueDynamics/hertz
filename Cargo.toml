[workspace]
resolver = "2"
members = [
    "crates/hertz-types",
    "crates/hertz-channels",
    "crates/hertz-sdr",
    "crates/hertz-dsp",
    "crates/hertz-daemon",
    "crates/hertz-tui",
    "crates/hertz-tx",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
num-complex = "0.4"
rustfft = "6.1"
hound = "3.5"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
